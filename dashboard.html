<head>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@100;200;300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<style>
    .hero {
        display: grid;
        grid-template-columns:minmax(300px, 1.5fr) minmax(300px, 1.5fr) minmax(250px, 1.2fr);
        gap: 10px;
        color: #93C5FD;
        font-family: "IBM Plex Sans Thai";
    }
    .container {
        display: grid;
        box-sizing: border-box;
        grid-template-rows:12rem 0.15fr 1fr;
        gap: 5px;
        padding: 5px;
        height: 100%;
        width: 100%;
        

    }
    .homework {
        display: grid;
        box-sizing: border-box;
        grid-template-rows: 1fr 5rem 1fr;
        background-color: white;
        position: relative;
        border-radius: 1rem;
    
    }
    .read {
        display: grid;
        box-sizing: border-box;
        grid-template-rows: 1fr 5rem 1fr;
        background-color: white;
        position: relative;
        border-radius: 1rem;
    }
    .paw {
        grid-row: 3; 
        position: absolute;
        left: 5px; 
        bottom: 5px;
        opacity: 0.8;
        transform: rotate(-15deg);
    }
    .classes {
        color: white;
        box-sizing: border-box;
        background-color: #93C5FD;
        border-radius: 1rem;
        display: grid;
        grid-template-rows: 1fr 2fr 1.2fr;
    }
    .btnclas {
        transition: all 0.3s ease;
    }
    .btnclas:hover {
        transform: scale(1.03);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .btnclas:hover .chevclas {
        transition: all 0.5s ease;
        transform: translate(5px);
        
    }
    .board {
        background-color: white;
        overflow: visible;
        overflow-y: auto;
        display: grid;
        grid-auto-rows: minmax(150px, 1fr) minmax(150px, 1fr) minmax(150px, 1fr);
        gap: 10px;
        padding: 5px;
        border-radius: 0.5rem;
    }
    .board::-webkit-scrollbar {
        background-color: transparent;
        width: 10px;
    }
    .board::-webkit-scrollbar-thumb {
        background-color: lavender;
        border-radius: 1rem;
    }
    .searchbar {
        background-color: white;
        color: white;
        
        border-radius: 0.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        outline: none;
    }
    .search {
        margin-left: 10px;
        border: none;
        color: #93C5FD;
        font-family: "IBM Plex Sans", "IBM Plex Sans Thai";
        font-weight: 700;
        font-size: 1rem;
        background-color: transparent;
        padding:20px;
    }
    .searchbar input[type="search"]::-webkit-search-cancel-button {
        -webkit-appearance: none;
        display: none;
        transition: all 0.3s ease;
    }
    .search:focus {
        outline: none;
        border: none;
    }
    .search:not(:placeholder-shown) ~ .isea {
        color: white;
    }
    .filter {
        display: flex;
        box-shadow: 0.5px 3.5px 3.5px rgba(53, 88, 114, 0.4);
        font-family: "IBM Plex Sans";
        font-weight: 600;
        align-items: center;
    }

    .bar {
        background-color: #EFF6FF;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        box-shadow: inset 3.5px 0.5em 0.6em rgba(127, 183, 225, 0.4);
        margin-right: 10px;
        
        width: 400px;
        border-radius: 2rem;
        
    }
    .isea {
        color: transparent;
    }
</style>
<section class="grid-container container">
    <div class="hero">
        <div class="homework">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                 <div style="font-weight: bolder; font-size: 1.5rem; padding-left: 20px;">การบ้าน</div>
                 <div style="font-weight: 600; padding-right: 20px;font-family: IBM Plex Sans;">subject</div>
            </div>
            <div style="display: flex; justify-content: center; align-items: center; font-size: 5rem; font-weight: 900;font-family: 'IBM Plex Sans', sans-serif;">1</div>
            <div style="display: flex; justify-content: right;margin-right: 25px; font-weight: bold;align-items: center;font-family: IBM Plex Sans; margin-right: 50px;">
                <div class="icon-clock-4" style="font-size: 1.3rem;margin-right: 5px;"></div>
                <div class="dead">deadline</div>
            </div>
            <svg class="paw" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="#F0F7FF" stroke="#F0F7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paw-print-icon lucide-paw-print">
                <defs>
                    <filter id="inset-shadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feComponentTransfer in="SourceAlpha">
                            <feFuncA type="table" tableValues="1 0" />
                        </feComponentTransfer>
                        <feGaussianBlur stdDeviation="0.8" />
                        <feOffset dx="0.5" dy="1.5" result="offsetblur" />
                        <feComposite operator="in" in="offsetblur" in2="SourceAlpha" result="insetshadow" />
                        <feFlood flood-color="#355872" flood-opacity="0.4" />
                        <feComposite operator="in" in2="insetshadow" />
                        <feComposite operator="over" in2="SourceGraphic" />
                    </filter>
                </defs>
                <g filter="url(#inset-shadow)" fill="#F0F7FF">
                    <circle cx="11" cy="4" r="2"/>
                    <circle cx="18" cy="8" r="2"/>
                    <circle cx="20" cy="16" r="2"/>
                    <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/> 
                </g>
            </svg>
        </div>
        
        <div class="read">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="font-weight: bolder; font-size: 1.5rem; padding-left: 20px;">To-do list</div>
                <div style="font-weight: 600; padding-right: 20px;font-family: IBM Plex Sans;">type</div>
            </div>
            <div style="display: flex; justify-content: center; align-items: center; font-size: 3rem; font-weight: 900;font-family: 'IBM Plex Sans', sans-serif;">task name</div>
            <div style="display: flex;justify-content: space-between;">
                <div style="margin-left:20px;display: flex; justify-content: left; font-weight: bold;align-items: center;font-family: IBM Plex Sans; margin-right: 50px;">
                    <div class="icon-hourglass" style="margin-right: 5px;"></div>
                    <div class="status">status</div>
                </div>
                <div style="display: flex; justify-content: right; font-weight: bold;align-items: center;font-family: IBM Plex Sans; margin-right: 50px;">
                    <div class="icon-clock-4" style="font-size: 1.3rem;margin-right: 5px;"></div>
                    <div class="dead">deadline</div>
                </div>  
            </div>
        </div>
        <div class="classes">
            <div  style="display: flex; justify-content: space-between; align-items: center; padding-top: 5px;">
                <div style="font-weight: bolder; font-size: 1.5rem; padding-left: 20px;">คาบ</div>
                <div style="display: flex; align-items: center;margin-right: 20px;font-weight: 900; justify-content: center;">
                    <div class="icon-clock-4" style="font-size: 1.3rem;margin-right: 5px;"></div>
                    <div class="dead">วันนี้</div>
                </div>
            </div>
            <div class=" midclas">
                <div  style="display: flex; justify-content: center;flex-direction: column;align-items: center;">
                    <div style="font-size: 3rem;font-weight: 900;line-height: 30px;padding-top: 30px;">class</div>
                    <div  style="display: flex;flex-direction: row; justify-content: center;align-items: center;color: #f1f1f1;font-weight: 500;">
                        <div id="startclas">start</div>
                        <div>-</div>
                        <div id="endclas">end</div>
                    </div>
                </div>
                
            </div>
            <div class="btnclas botclas" onclick="loadPage('classes.html'); activateNav('note.html');" style="cursor: pointer; display: flex;justify-content: center;align-items: center;background-color: #BFDBFE;margin: 10px;border-radius: 12px;">
                <div  style="color: #f1f1f1; font-weight: 900;display: flex;flex-direction: row; align-items: center;margin-left: 8px;">ตารางเรียน<div class="chevclas icon-chevron-right" style="margin-left: 10px;"></div></div>
            </div>
        </div>
    </div>
    <div class="searchbar">
        <div style="color: #93C5FD; font-family: 'IBM Plex Sans Thai';font-weight: 900; margin-left: 50px;font-size: 2rem; display: flex;flex-direction: row; align-items: center;">
            <div class="icon-cloud" style="margin: 10px; font-size: 2.5rem;"></div>
            <div>
                บอร์ดรวม
            </div>
        </div>
        <div style="display: flex;flex-direction: row;">
            <div class="bar">
                <input type="search" class="search" placeholder="search. . .">
                <div class="icon-search isea" style="font-size: 1.5rem;"></div>
            </div>
            <div class="filter" style="padding: 10px;background-color: #93C5FD;border-radius: 1rem;">filter</div>
        </div>
        
    </div>
    <div class="board">
        <div class="border"></div>
        <div class="border"></div>
        <div class="border"></div>
        <div class="border"></div>
        <div class="border"></div>
        <div class="border"></div>
        <div class="border"></div>
        <div class="border"></div>
        <div class="border"></div>
    </div>
</section>
