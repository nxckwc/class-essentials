<head>
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@100;200;300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<style>

    .overview {
        display: grid;
        gap: 5px;
        grid-template-columns: 250px 1fr;
        min-height: 0;
        transition: grid-template-columns 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .overview.collapsed {
        grid-template-columns: 45px 1fr;
        transition: grid-template-columns 0.3s ease;
        
    }
    .height-collapsed {
        max-height: 40px !important;
    }
    .width-collapsed {
        grid-template-columns: 45px 1fr !important;
    }
    .overview.collapsed .filter-text {
        transform: translateX(-200%);
        position: absolute;
        overflow: hidden;
    }
    .overview.collapsed .sidebar {
        max-height: 40px;
        transition: max-height 0.3s ease 0.3s;
    }
    .sidebar {
        overflow: hidden;
        max-height: 1000px;
        transition: max-height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        
    }
    .filter {
        display: flex;
        box-shadow: 0.5px 3.5px 3.5px rgb(53, 88, 114,0.05);
        font-family: "IBM Plex Sans";
        font-weight: 600;
        align-items: center;
        position: relative;
        padding: 0px 10px;
        box-sizing: border-box;
        overflow: hidden;
        
    }
    .filter-text {
        position: absolute;
        left: 10px;
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        white-space: nowrap;
        display: inline-block;
        color: #355872;
        pointer-events: none;
        font-family: "IBM Plex Sans Thai";
        font-weight: 900;
    }
   .icon-menu {
        margin-left: auto;
        cursor: pointer;
   }
   /* Styling for the empty state container */
    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        grid-row: 1 / -1; /* Spans across the grid if .result is a grid */
        grid-column: 1 / -1;
        padding: 40px;
        
        color: #BFDBFE;
        font-family: 'IBM Plex Sans Thai';
        animation: fadeIn 0.5s ease forwards;
    }

    .empty-state .icon-circle-alert {
        font-size: 4rem;
        margin-bottom: 10px;
        opacity: 0.5;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
