    let isAnimating = false;

    function toggleFilter() {
        if (isAnimating) return;

        const overview = document.getElementById('filter');
        const sidebar = overview.querySelector('.sidebar');
        const isCollapsing = !overview.classList.contains('collapsed');

        const HEIGHT_DURATION = 200;
        const WIDTH_DURATION = 200;

        isAnimating = true;

        if (isCollapsing) {
            // --- COLLAPSE (same as before, smooth) ---
            overview.classList.add('width-collapsed');

            requestAnimationFrame(() => {
                sidebar.classList.add('height-collapsed');
                overview.classList.add('collapsed');
            });

            setTimeout(() => {
                isAnimating = false;
            }, WIDTH_DURATION);

        } else {
            // --- EXPAND (NEW SEQUENCE) ---

            // 1. Roll DOWN first (height)
            sidebar.classList.remove('height-collapsed');

            // 2. After height finishes → unfold width
            setTimeout(() => {
                overview.classList.remove('width-collapsed');
                overview.classList.remove('collapsed');
            }, HEIGHT_DURATION);

            // Unlock after full animation
            setTimeout(() => {
                isAnimating = false;
            }, HEIGHT_DURATION + WIDTH_DURATION);
        }
    }
